<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment | Getsee Coffee & Donuts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:ital,wght@0,400;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2026_royal_blue" />
</head>
<body>
  <div class="site-container">
    <header class="topbar">
      <nav class="nav">
        <a class="brand" href="index.html" aria-label="Getsee home">
          <span class="brand-logo"><img src="assets/logo-baru-clean.png" alt="Getsee Coffee & Donuts"></span>
        </a>
        <div class="nav-links" aria-label="Main navigation">
          <a href="index.html">Delivery</a>
          <a href="menu.html">Get Fresh</a>
          <a href="index.html#promo">Exclusive</a>
          <a href="index.html#contact">Large Order</a>
        </div>
        <div class="actions">
          <button class="cart" aria-label="Cart" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L22 6H6"></path>
            </svg>
            <span class="cart-count">0</span>
          </button>
          <a class="login-btn" href="login.html">Login</a>
        </div>
      </nav>
    </header>

    <main class="payment-page page">
      <section class="payment-panel">
        <div>
          <p class="eyebrow">Payment</p>
          <h1>Checkout</h1>
          <div class="payment-list" id="paymentList"></div>
        </div>
        <aside class="payment-summary">
          <h2>Order Summary</h2>
          <div class="summary-row"><span>Total</span><strong id="paymentTotal">Rp0</strong></div>
          <div class="payment-methods" aria-label="Payment method">
            <label><input type="radio" name="paymentMethod" value="QRIS" checked> QRIS Demo</label>
            <label><input type="radio" name="paymentMethod" value="VA"> Virtual Account Demo</label>
            <label><input type="radio" name="paymentMethod" value="CASH"> Pay at Counter</label>
          </div>
          <p class="payment-status" id="paymentStatus">Demo payment only. No real payment gateway is connected yet.</p>
          <button class="pay-btn" id="payButton" type="button">Pay Now</button>
          <div class="pickup-result" id="pickupResult" hidden>
            <small>Pickup code</small>
            <strong id="pickupCode"></strong>
            <div class="qr-box" id="qrBox" aria-label="QR pickup code"></div>
            <p>Show this QR or code when picking up your order.</p>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script src="js/nav.js?v=2026_fullstack"></script>
  <script src="js/shop.js?v=2026_fullstack"></script>
  <script src="js/payment.js?v=2026_fullstack"></script>
</body>
</html>
