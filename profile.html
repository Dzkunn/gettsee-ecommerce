<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Getsee Coffee & Donuts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:ital,wght@0,400;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2026_royal_blue" />
</head>
<body>
  <div class="site-container">
    <header class="topbar">
      <nav class="nav">
        <a class="brand" href="index.html" aria-label="Getsee home">
          <span class="brand-logo"><img src="assets/logo-baru-clean.png" alt="Getsee Coffee & Donuts"></span>
        </a>
        <div class="nav-links" aria-label="Main navigation">
          <a href="index.html">Order Pickup</a>
          <a href="menu.html">Get Fresh</a>
          <a href="index.html#promo">Exclusive</a>
          <a href="index.html#contact">Large Order</a>
        </div>
        <div class="actions">
          <button class="cart" aria-label="Cart" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L22 6H6"></path>
            </svg>
            <span class="cart-count">0</span>
          </button>
          <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu" type="button">
            <span class="bar bar-1"></span>
            <span class="bar bar-2"></span>
            <span class="bar bar-3"></span>
          </button>
          <a class="login-btn active" href="profile.html">Login</a>
        </div>
      </nav>
      <div class="nav-backdrop" id="navBackdrop"></div>
    </header>

    <main class="profile-page page">
      <section class="profile-panel">
        <div class="profile-copy">
          <p class="eyebrow">Account</p>
          <h1>Profile</h1>
          <p>Kelola data akun dan lihat riwayat kode pengambilan pesanan (pickup).</p>
          <img src="assets/stickers/mascot-wave-hd.png" alt="" aria-hidden="true">

          <div style="margin-top: 24px; text-align: left;">
            <h3 style="font-size: 16px; font-family: 'Montserrat', sans-serif; font-weight: 800; color: #00438D; margin-bottom: 12px;">Riwayat Pesanan (Pickup)</h3>
            <div id="orderHistoryList"></div>
          </div>
        </div>
        <form class="profile-form" id="profileForm" action="#" method="post">
          <label>
            Email
            <input type="email" name="email" readonly>
          </label>
          <label>
            Nama Lengkap
            <input type="text" name="name" placeholder="Nama Anda" autocomplete="name">
          </label>
          <label>
            Tanggal Lahir
            <input type="date" name="birthDate" autocomplete="bday">
          </label>
          <label>
            Jenis Kelamin
            <select name="gender">
              <option value="">Pilih jenis kelamin</option>
              <option value="female">Perempuan</option>
              <option value="male">Laki-laki</option>
              <option value="prefer-not-to-say">Memilih tidak menyebutkan</option>
            </select>
          </label>
          <p class="auth-message" id="profileMessage" aria-live="polite"></p>
          <button class="login-submit" type="submit">Simpan Profil</button>
          <button class="logout-btn" id="logoutButton" type="button">Keluar (Logout)</button>
        </form>
      </section>
    </main>
  </div>

  <script src="js/shop.js?v=2026_fullstack"></script>
  <script src="js/nav.js?v=2026_fullstack"></script>
  <script src="js/profile.js?v=2026_fullstack"></script>
</body>
</html>
